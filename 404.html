<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Agência RISE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6c11d0">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#221d2c;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:420px;text-align:center}
    .mark{font-size:28px;font-weight:800;letter-spacing:-1.6px;color:#241a33}
    .mark i{font-style:normal;color:#6c11d0}
    .code{margin:28px 0 6px;font-size:11px;font-weight:800;letter-spacing:2px;color:#7a35bd}
    h1{margin:0 0 10px;font-size:28px;letter-spacing:-1.1px}
    p{margin:0 0 26px;color:#817a8d;font-size:13.5px;line-height:1.65}
    a{display:inline-flex;align-items:center;min-height:45px;padding:0 18px;border-radius:10px;background:#6c11d0;color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
    a:hover{background:#7c1fdf}
  </style>
</head>
<body>
  <main>
    <div class="mark">rise<i>.</i></div>
    <div class="code">ERRO 404</div>
    <h1>Página não encontrada.</h1>
    <p>O endereço acessado não existe. Volte para a página inicial para entrar no sistema.</p>
    <a id="home" href="./">Voltar ao início</a>
  </main>
  <script>
    (function () {
      // GitHub Pages de projeto fica em usuario.github.io/<repositorio>/; o 404 pode ser servido em qualquer subcaminho.
      var link = document.getElementById("home");
      var segments = location.pathname.split("/").filter(Boolean);
      var base = /\.github\.io$/i.test(location.hostname) && segments.length ? "/" + segments[0] + "/" : "/";
      link.setAttribute("href", base);
    })();
  </script>
</body>
</html>
